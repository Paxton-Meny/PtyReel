name: action

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: action-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the commit under test
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git -c protocol.version=2 \
              -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' \
              fetch --no-tags --depth=1 "https://github.com/$GH_REPOSITORY" "$GH_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Render the hero demo
        id: hero
        uses: ./
        with:
          tape: demos/hello.tape

      - name: Render the self-check demo
        id: selfcheck
        uses: ./
        with:
          tape: demos/check.tape

      - name: Validate a tape without running it
        id: dryrun
        uses: ./
        with:
          tape: demos/colors.tape
          check: true

      - name: The action reported what it wrote
        shell: bash
        env:
          HERO: ${{ steps.hero.outputs.svg-path }}
          SELFCHECK: ${{ steps.selfcheck.outputs.svg-path }}
          DRYRUN: ${{ steps.dryrun.outputs.svg-path }}
        run: |
          set -euo pipefail
          test "$HERO" = "demos/out/hello.svg"
          test "$SELFCHECK" = "demos/out/check.svg"
          test -z "$DRYRUN"

      - name: The committed demos are up to date
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --stat -- demos/out/hello.svg demos/out/check.svg
