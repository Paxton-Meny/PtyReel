<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" preserveAspectRatio="xMidYMid meet" role="img">
<title>fixture</title>
<style>
text{font-family:'Fira Code', 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'DejaVu Sans Mono', Consolas, monospace;font-size:15px;fill:#1f2328;white-space:pre}
.c,.v{opacity:0;animation-duration:5.000s;animation-timing-function:step-end;animation-iteration-count:infinite;animation-fill-mode:none}
.s1{fill:#116329}
.r0{animation-name:r0}
@keyframes r0{0%{opacity:0}1.6000%{opacity:1}}
.r1{animation-name:r1}
@keyframes r1{0%{opacity:0}17.6000%{opacity:1}}
.r2{animation-name:r2}
@keyframes r2{0%{opacity:0}77.6000%{opacity:1}}
.w0{animation-name:w0}
@keyframes w0{0%{opacity:0}1.6000%{opacity:1}17.6000%{opacity:0}}
.w1{animation-name:w1}
@keyframes w1{0%{opacity:0}17.6000%{opacity:1}}
#scroll{animation:scroll 5.000s step-end infinite;animation-fill-mode:none}
@keyframes scroll{0.0000%{transform:translateY(0px)}78.0000%{transform:translateY(-24px)}}
#cursor{fill:#0969da;animation:track 5.000s step-end infinite,blink 1.100s step-end infinite;animation-fill-mode:none,none}
@keyframes track{0.0000%{transform:translate(0px,2px)}18.0000%{transform:translate(36px,26px)}78.0000%{transform:translate(36px,50px)}}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.c{opacity:1}}
</style>
<defs>
<linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#8c9aad" stop-opacity="0.16"/>
<stop offset="1" stop-color="#c9d1d9" stop-opacity="0.09"/>
</linearGradient>
<filter id="lift" x="-12%" y="-10%" width="124%" height="130%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="8.872" result="wb"/>
<feOffset in="wb" dy="7.985" result="wo"/>
<feFlood flood-color="#1f2328" flood-opacity="0.42" result="wf"/>
<feComposite in="wf" in2="wo" operator="in" result="ws"/>
<feGaussianBlur in="SourceAlpha" stdDeviation="2.218" result="tb"/>
<feOffset in="tb" dy="1.774" result="to"/>
<feFlood flood-color="#1f2328" flood-opacity="0.30" result="tf"/>
<feComposite in="tf" in2="to" operator="in" result="ts"/>
<feMerge>
<feMergeNode in="ws"/><feMergeNode in="ts"/><feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<clipPath id="window-clip">
<rect x="27" y="26" width="346" height="248" rx="10" ry="10"/>
</clipPath>
<clipPath id="content-clip">
<rect x="27" y="70" width="346" height="204"/>
</clipPath>
</defs>
<rect x="0" y="0" width="400" height="300" rx="18" ry="18" fill="url(#backdrop)"/>
<g filter="url(#lift)">
<rect x="27" y="26" width="346" height="248" rx="10" ry="10" fill="#ffffff"/>
<g clip-path="url(#window-clip)">
<rect x="27" y="26" width="346" height="44" fill="#f6f8fa"/>
<line x1="27" y1="70.500" x2="373" y2="70.500" stroke="#d0d7de" stroke-opacity="0.8" stroke-width="1"/>
<circle cx="51" cy="48" r="6" fill="#ff5f56" stroke="#000000" stroke-opacity="0.12"/>
<circle cx="73" cy="48" r="6" fill="#ffbd2e" stroke="#000000" stroke-opacity="0.12"/>
<circle cx="95" cy="48" r="6" fill="#27c93f" stroke="#000000" stroke-opacity="0.12"/>
<text x="200.000" y="53" text-anchor="middle" font-family="&#39;Fira Code&#39;, &#39;JetBrains Mono&#39;, &#39;SF Mono&#39;, &#39;Cascadia Code&#39;, &#39;DejaVu Sans Mono&#39;, Consolas, monospace" font-size="13" letter-spacing="0.2" fill="#656d76">fixture</text>
<g clip-path="url(#content-clip)">
<g id="scroll" transform="translate(51,94) translate(0,-24)" xml:space="preserve">
<text x="0" y="17"><tspan x="0" textLength="18" lengthAdjust="spacingAndGlyphs">aa</tspan></text>
<text x="0" y="41" class="v w0"><tspan x="0" textLength="27" class="c r0" lengthAdjust="spacingAndGlyphs">50%</tspan></text>
<text x="0" y="41" class="v w1"><tspan x="0" textLength="36" class="c r1" lengthAdjust="spacingAndGlyphs">100%</tspan></text>
<text x="0" y="65"><tspan x="0" textLength="36" class="s1 c r2" lengthAdjust="spacingAndGlyphs">done</tspan></text>
<rect id="cursor" x="0" y="0" width="9" height="19" rx="1.500" transform="translate(36,50)"/>
</g>
</g>
</g>
<rect x="27.500" y="26.500" width="345" height="247" rx="9.500" ry="9.500" fill="none" stroke="#d0d7de" stroke-width="1"/>
<rect x="26.500" y="25.500" width="347" height="249" rx="10.500" ry="10.500" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
</g>
</svg>
